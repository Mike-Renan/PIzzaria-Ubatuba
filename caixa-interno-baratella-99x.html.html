<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos - Pizzaria Ubatuba</title>
    <link rel="shortcut icon" href="./img/logo-pizza.jpg" type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">
    <!-- Reprodutor de áudio escondido -->
    <audio id="som-alarme" src="./img/sompedido.wav" preload="auto" loop></audio>

    <div class="max-w-4xl mx-auto">
        <!-- ... resto do seu código ... -->
        <div class="max-w-4xl mx-auto">
            <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
               <img src="./img/logo2.png" alt="Logo Baratella Pizzaria" class="w-16 h-16 object-contain rounded-full shadow-sm border border-gray-100">
                <h1 class="text-2xl font-bold text-red-600">🍕 Painel de Pedidos (Caixa)</h1>
                <button id="btn-som" onclick="desbloquearSom()"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded-full font-medium text-sm transition">
                    🔇 Clique aqui para ativar o Som
                </button>
                <!-- NOVO BOTÃO -->
                <button id="btn-zerar" onclick="zerarNumeracao()"
                    class="bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1 rounded-full font-medium text-sm transition shadow-sm border border-purple-200">
                    🔄 Reiniciar Numeração (Novo Dia)
                </button>
                <span id="status-conexao"
                    class="text-sm bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-medium">Conectando...</span>
                </header>
                <!-- Barra de Navegação do Painel do Caixa -->
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 bg-white p-4 rounded-lg shadow">
                    <h2 class="text-xl font-bold text-gray-800">Painel de Comandas - Baratella Pizzaria</h2>
                
                    <div class="flex gap-3 w-full sm:w-auto">
                        <!-- Botão para ver os pedidos em andamento -->
                        <button onclick="carregarPedidosAtivos()"
                            class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg transition shadow text-sm">
                            🔥 Pedidos Ativos
                        </button>
                
                        <!-- Botão para ver o histórico de concluídos -->
                        <button onclick="carregarHistoricoPedidos()"
                            class="flex-1 sm:flex-none bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded-lg transition shadow text-sm">
                            📜 Histórico de Concluídos
                        </button>
                    </div>
                </div>
                <div id="lista-pedidos" class="grid gap-4">
                    <p class="text-gray-500 text-center py-10 bg-white rounded-lg shadow">Carregando pedidos...</p>
                </div>
                </div>
                
                <!-- Importando o nosso arquivo JavaScript separado -->
        <script src="painel.js"></script>
</body>

</html>
