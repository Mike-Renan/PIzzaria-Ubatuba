<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos - Pizzaria Ubatuba</title>
    <link rel="shortcut icon" href="./img/logo-pizza.jpg" type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">
    <!-- Reprodutor de áudio escondido -->
    <audio id="som-alarme" src="./img/sompedido.wav" preload="auto" loop></audio>

    <div class="max-w-4xl mx-auto">
        <!-- ... resto do seu código ... -->
        <div class="max-w-4xl mx-auto">
            <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
              <!-- CABEÇALHO UNIFORME E ESPAÇADO -->

    
    <!-- Logo e Título -->
    <div class="flex items-center gap-3">
        <img src="./img/logo-pizza.jpg" alt="Logo" class="w-12 h-12 object-cover rounded-full border">
        <!-- Ajuste o nome da imagem da logo se necessário -->
        <h1 class="text-xl font-extrabold text-red-600 flex items-center gap-2 m-0">
            🍕 Painel de Pedidos (Caixa)
        </h1>
    </div>
    
    <!-- Grupo de Botões e Status Padronizados -->
    <div class="flex flex-wrap items-center gap-3 justify-center lg:justify-end">
    
        <!-- Botão de Som -->
        <button id="btn-som" onclick="desbloquearSom()"
            class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2.5 rounded-lg text-sm font-medium transition border border-gray-300 shadow-sm flex items-center gap-2">
            🔇 Clique aqui para ativar o Som
        </button>
    
        <!-- Botão Reiniciar Numeração -->
        <button onclick="zerarNumeracao()"
            class="bg-purple-50 hover:bg-purple-100 text-purple-800 px-4 py-2.5 rounded-lg text-sm font-medium transition border border-purple-200 shadow-sm flex items-center gap-2">
            🔄 Reiniciar Numeração (Novo Dia)
        </button>
    
        <!-- Status de Conexão -->
        <div id="status-conexao"
            class="bg-green-50 text-green-800 px-4 py-2.5 rounded-lg text-sm font-medium border border-green-200 shadow-sm flex items-center gap-2">
            🟢 Online (Tempo Real)
        </div>
    
        <!-- Botão Gerenciar Cardápio -->
        <button onclick="carregarPainelCardapio()"
            class="bg-gray-900 hover:bg-gray-800 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
            ⚙️ Gerenciar Cardápio e Preços
        </button>
    
    </div>
    </div>
                </header>
                <!-- Barra de Navegação do Painel do Caixa -->
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 bg-white p-4 rounded-lg shadow">
                    <h2 class="text-xl font-bold text-gray-800">Painel de Comandas - Baratella Pizzaria</h2>
                
                    <div class="flex gap-3 w-full sm:w-auto">
                        <!-- Botão para ver os pedidos em andamento -->
                        <button onclick="carregarPedidosAtivos()"
                            class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg transition shadow text-sm">
                            🔥 Pedidos Ativos
                        </button>
                
                        <!-- Botão para ver o histórico de concluídos -->
                        <button onclick="carregarHistoricoPedidos()"
                            class="flex-1 sm:flex-none bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-4 py-2 rounded-lg transition shadow text-sm">
                            📜 Histórico de Concluídos
                        </button>
                    </div>
                </div>
                <div id="lista-pedidos" class="grid gap-4">
                    <p class="text-gray-500 text-center py-10 bg-white rounded-lg shadow">Carregando pedidos...</p>
                </div>
                </div>
                
                <!-- Importando o nosso arquivo JavaScript separado -->
        <script src="painel.js?v=4"></script>
</body>

</html>
