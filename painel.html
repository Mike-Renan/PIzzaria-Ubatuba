<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos - Pizzaria Ubatuba</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-red-600">🍕 Painel de Pedidos (Caixa)</h1>
            <button id="btn-som" onclick="desbloquearSom()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded-full font-medium text-sm transition">
            🔇 Clique aqui para ativar o Som
        </button>
            <span id="status-conexao" class="text-sm bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-medium">Conectando...</span>
        </header>
        
        <div id="lista-pedidos" class="grid gap-4">
            <p class="text-gray-500 text-center py-10 bg-white rounded-lg shadow">Carregando pedidos...</p>
        </div>
    </div>

    <!-- Importando o nosso arquivo JavaScript separado -->
    <script src="painel.js"></script>
</body>
</html>
